[package]
name = "city"
version = "0.1.0"
edition = "2021"
description = "Neartropolitan authoritative economy contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
